version: 2
updates:
  # Python dependencies declared in pyproject.toml / uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions used by the generation/release workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    groups:
      github-actions:
        patterns:
          - "*"
